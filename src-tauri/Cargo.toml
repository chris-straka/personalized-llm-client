[package]
name = "ccez-studio"
version = "0.1.1"
description = "Ccez Studio — macOS desktop chatbot"
authors = ["ccez"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ccez_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Default TLS crypto provider (ring). Tauri core's mobile-dev protocol
# handler builds a reqwest client that panics without one — see
# install_tls_provider in lib.rs.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

# Native TTS (AVSpeechSynthesizer) on macOS and iOS. Pure-Rust
# bindings via objc2 — no Objective-C is written anywhere in this
# project. AppKit stays macOS-only: it does not exist on iOS.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-avf-audio = "0.3"
objc2-natural-language = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"

# Android-only native TTS (TextToSpeech over JNI into Tts.kt).
# jni matches wry's version so JNI types unify (see cargo tree).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
