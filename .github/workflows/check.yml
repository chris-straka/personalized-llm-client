name: check

# Cross-target Rust gates on every push and PR. The v0.2.1 release taught
# this lesson: per-OS `#[tauri::command]` attributes and Windows crate
# features only break the build on their own target, and nothing compiled
# those targets until release CI ran. These `cargo check` jobs compile
# every target the release workflows bundle, minus the bundling itself.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked
      - run: cargo test --locked

  rust-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: cargo check --locked --target x86_64-unknown-linux-gnu

  rust-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --locked --target ${{ matrix.target }}
